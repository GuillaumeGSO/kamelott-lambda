AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Kaamelott lorem ipsum \u2014 random quote generator Lambda + API Gateway\
  \ REST API\n"
Globals:
  Function:
    Timeout: 3
Resources:
  KamelottFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: KamelottFunction
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
      - x86_64
      Events:
        Kamelott:
          Type: Api
          Properties:
            Path: /kamelott
            Method: get
    Metadata:
      SamResourceId: KamelottFunction
Outputs:
  KamelottApi:
    Description: API Gateway endpoint URL for Prod stage for Kamelott function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/kamelott/
  KamelottFunction:
    Description: Kamelott Lambda Function ARN
    Value:
      Fn::GetAtt:
      - KamelottFunction
      - Arn
  KamelottFunctionIamRole:
    Description: Implicit IAM Role created for Kamelott function
    Value:
      Fn::GetAtt:
      - KamelottFunctionRole
      - Arn
